name: mission
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.7.0-209.1.beta <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  table_calendar: ^3.0.9
  firebase_auth: ^5.5.1
  google_sign_in: ^6.2.1
  firebase_core: ^3.12.1
  intl: ^0.20.2
  url_launcher: ^6.2.6

  image_picker: ^1.1.1
  path_provider: ^2.1.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

    - assets/images/
    - assets/images/calendar.png
    - assets/images/check.png
    - assets/images/rocket.png