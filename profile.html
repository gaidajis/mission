<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | The Mission</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-header {
            background: linear-gradient(135deg, var(--bg-surface) 0%, var(--bg-deep) 100%);
            border-bottom: 1px solid var(--border);
            padding: 4rem 2rem 2rem 2rem;
            text-align: center;
        }

        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .stat-box { text-align: center; }
        .stat-box .num { font-size: 1.5rem; font-weight: 700; color: var(--accent-teal); }
        .stat-box .label { font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }

        .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 2rem; }
        .tab { padding: 1rem 2rem; cursor: pointer; color: var(--text-secondary); font-weight: 600; }
        .tab.active { color: var(--accent-teal); border-bottom: 2px solid var(--accent-teal); }

        .review-card { padding: 1.5rem; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 1rem; }

        @media (max-width: 768px) {
            .profile-stats { flex-wrap: wrap; gap: 1.5rem; }
            .tabs { overflow-x: auto; white-space: nowrap; }
            .tab { padding: 1rem; }
        }
    </style>
</head>
<body>

    <nav style="padding: 1rem 2rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top:0; background: rgba(5,13,26,0.9); backdrop-filter: blur(10px); z-index: 100;">
        <a href="app.html" class="nav-logo" style="display: flex; align-items: center; gap: 0.5rem;">
            <span>←</span> ◎ THE MISSION
        </a>
    </nav>

    <div class="profile-header">
        <div class="container">
            <div style="display: inline-block; position: relative;">
                <img id="p-avatar" class="avatar avatar-lg mb-4" src="" alt="Avatar">
                <div id="p-flag" style="position: absolute; bottom: 10px; right: 0; font-size: 2rem; background: var(--bg-deep); border-radius: 50%; padding: 2px; line-height: 1;"></div>
            </div>

            <h1 id="p-name" style="font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem;"></h1>
            <p id="p-location" class="text-secondary mb-2">📍 </p>
            <span id="p-role" class="chip mb-4"></span>

            <p id="p-bio" class="body-text mx-auto mt-4" style="max-width: 600px;"></p>

            <div id="edit-btn-container" class="mt-6" style="display: none;">
                <button class="btn btn-secondary" onclick="toggleEditMode()">Edit Profile</button>
            </div>

            <div class="profile-stats">
                <div class="stat-box">
                    <div id="p-stat-posted" class="num">0</div>
                    <div class="label">Posted</div>
                </div>
                <div class="stat-box">
                    <div id="p-stat-completed" class="num">0</div>
                    <div class="label">Completed</div>
                </div>
                <div class="stat-box">
                    <div id="p-stat-rating" class="num" style="color: var(--accent-gold);">0.0 ★</div>
                    <div class="label">Rating</div>
                </div>
            </div>
        </div>
    </div>

    <div class="container" style="padding-top: 2rem; padding-bottom: 5rem;">

        <div class="tabs">
            <div class="tab active" id="tab-missions" onclick="switchProfileTab('missions')">Active Missions</div>
            <div class="tab" id="tab-reviews" onclick="switchProfileTab('reviews')">Reviews (<span id="review-count">0</span>)</div>
        </div>

        <div id="view-missions">
            <div class="masonry-grid" id="profile-missions-grid"></div>
        </div>

        <div id="view-reviews" style="display: none;">
            <div id="reviews-list"></div>
        </div>

    </div>

    <!-- Edit Profile Modal -->
    <div id="edit-modal" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center;">
        <div class="card" style="width: 100%; max-width: 500px;">
            <h3 class="mb-4">Edit Profile</h3>

            <div class="form-group">
                <label for="edit-name">Name</label>
                <input type="text" id="edit-name" class="form-control">
            </div>
            <div class="form-group">
                <label for="edit-loc">Location</label>
                <input type="text" id="edit-loc" class="form-control">
            </div>
            <div class="form-group">
                <label for="edit-bio">Bio</label>
                <textarea id="edit-bio" class="form-control" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label for="edit-role">Role</label>
                <select id="edit-role" class="form-control">
                    <option value="Requester">Requester (I post missions)</option>
                    <option value="Provider">Provider (I help others)</option>
                    <option value="Both">Both</option>
                </select>
            </div>

            <div class="flex gap-2 mt-6">
                <button class="btn btn-secondary w-full" onclick="toggleEditMode()">Cancel</button>
                <button class="btn btn-primary w-full" onclick="saveProfile()">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const loggedInUser = getSession();
        const urlParams = new URLSearchParams(window.location.search);
        let profileId = urlParams.get('id');

        // If no ID provided, show own profile if logged in, else redirect
        if (!profileId) {
            if (loggedInUser) {
                profileId = loggedInUser.id;
            } else {
                window.location.href = 'login.html';
            }
        }

        const profileUser = getUserById(profileId);

        document.addEventListener('DOMContentLoaded', () => {
            if (!profileUser) {
                document.body.innerHTML = '<div style="text-align:center; padding: 5rem;"><h1>User Not Found</h1><a href="app.html" class="btn btn-primary mt-4">Go Back</a></div>';
                return;
            }

            // Render Header
            document.getElementById('p-avatar').src = getInitialsAvatar(profileUser.name);
            document.getElementById('p-flag').innerText = profileUser.flag || '🌍';
            document.getElementById('p-name').innerText = profileUser.name;
            document.getElementById('p-location').innerText = `📍 ${profileUser.location}`;
            document.getElementById('p-role').innerText = profileUser.role;
            document.getElementById('p-bio').innerText = profileUser.bio || 'No bio provided.';

            // Stats
            document.getElementById('p-stat-posted').innerText = profileUser.missionsPosted || 0;
            document.getElementById('p-stat-completed').innerText = profileUser.tasksCompleted || 0;

            const reviews = profileUser.reviews || [];
            document.getElementById('review-count').innerText = reviews.length;
            if(reviews.length > 0) {
                const avg = reviews.reduce((a, b) => a + b.rating, 0) / reviews.length;
                document.getElementById('p-stat-rating').innerText = `${avg.toFixed(1)} ★`;
            } else {
                document.getElementById('p-stat-rating').innerText = 'New';
            }

            // Show Edit Button if own profile
            if (loggedInUser && loggedInUser.id === profileUser.id) {
                document.getElementById('edit-btn-container').style.display = 'block';
            }

            // Load Content
            loadProfileMissions();
            loadReviews();
        });

        function switchProfileTab(tab) {
            document.getElementById('tab-missions').classList.remove('active');
            document.getElementById('tab-reviews').classList.remove('active');
            document.getElementById('tab-' + tab).classList.add('active');

            document.getElementById('view-missions').style.display = 'none';
            document.getElementById('view-reviews').style.display = 'none';
            document.getElementById('view-' + tab).style.display = 'block';
        }

        function loadProfileMissions() {
            // Get all open/in_progress where user is requester OR provider
            const allReqs = getRequests({ status: 'open' }).concat(getRequests({ status: 'in_progress' }));
            const userReqs = allReqs.filter(r => r.requesterId === profileUser.id || r.providerId === profileUser.id);

            const grid = document.getElementById('profile-missions-grid');
            grid.innerHTML = '';

            if (userReqs.length === 0) {
                grid.style.display = 'block';
                grid.innerHTML = `<div class="text-center text-secondary py-8">No active missions.</div>`;
                return;
            }

            grid.style.display = 'grid';
            userReqs.forEach(req => {
                const cat = CATEGORIES[req.category];
                const card = document.createElement('div');
                card.className = `card hoverable cat-border ${cat.className}`;
                card.style.cursor = 'pointer';
                card.onclick = () => window.location.href = `request.html?id=${req.id}`;

                let relation = (req.requesterId === profileUser.id) ? 'Posting' : 'Helping';

                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="chip" style="color: ${cat.color}; border-color: ${cat.color}40">${cat.icon} ${req.category}</span>
                        <span class="caption text-secondary">${relation}</span>
                    </div>
                    <h4 class="mb-2">${req.title}</h4>
                    <div class="flex justify-between caption">
                        <span>📍 ${req.location.split(',')[0]}</span>
                        <span style="color: var(--accent-teal); font-weight: 600;">${formatBudget(req.budget, req.currency)}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function loadReviews() {
            const list = document.getElementById('reviews-list');
            const reviews = profileUser.reviews || [];

            if (reviews.length === 0) {
                list.innerHTML = `<div class="text-center text-secondary py-8">No reviews yet.</div>`;
                return;
            }

            // Sort newest first
            reviews.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(rev => {
                const reviewer = getUserById(rev.reviewerId);
                const rName = reviewer ? reviewer.name : 'Unknown User';
                const rAvatar = reviewer ? getInitialsAvatar(reviewer.name) : '';

                const dateForm = new Date(rev.date).toLocaleDateString();
                const stars = '★'.repeat(rev.rating) + '☆'.repeat(5 - rev.rating);

                const el = document.createElement('div');
                el.className = 'review-card';
                el.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center gap-3">
                            <img class="avatar avatar-sm" src="${rAvatar}">
                            <div>
                                <div style="font-weight: 600; font-size: 0.9rem;">${rName}</div>
                                <div class="caption">${dateForm}</div>
                            </div>
                        </div>
                        <div style="color: var(--accent-gold); font-size: 1.2rem; letter-spacing: 2px;">${stars}</div>
                    </div>
                    <p class="body-text" style="font-size: 0.95rem;">"${rev.comment}"</p>
                `;
                list.appendChild(el);
            });
        }

        function toggleEditMode() {
            const modal = document.getElementById('edit-modal');
            if (modal.style.display === 'none') {
                document.getElementById('edit-name').value = profileUser.name;
                document.getElementById('edit-loc').value = profileUser.location;
                document.getElementById('edit-bio').value = profileUser.bio;
                document.getElementById('edit-role').value = profileUser.role;
                modal.style.display = 'flex';
            } else {
                modal.style.display = 'none';
            }
        }

        function saveProfile() {
            profileUser.name = document.getElementById('edit-name').value;
            profileUser.location = document.getElementById('edit-loc').value;
            profileUser.bio = document.getElementById('edit-bio').value;
            profileUser.role = document.getElementById('edit-role').value;

            saveUser(profileUser);
            showToast("Profile updated successfully!");
            setTimeout(() => location.reload(), 1000);
        }
    </script>
</body>
</html>
