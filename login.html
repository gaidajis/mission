<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | The Mission</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 2rem; }
        .tab { flex: 1; text-align: center; padding: 1rem; cursor: pointer; color: var(--text-secondary); font-weight: 600; }
        .tab.active { color: var(--accent-teal); border-bottom: 2px solid var(--accent-teal); }
        .demo-accounts { margin-top: 3rem; border-top: 1px solid var(--border); padding-top: 2rem; }
        .demo-card {
            display: flex; align-items: center; gap: 1rem; padding: 0.75rem;
            border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.5rem;
            cursor: pointer; transition: all 0.2s;
        }
        .demo-card:hover { background-color: var(--bg-elevated); border-color: var(--accent-teal); }
    </style>
</head>
<body>
    <div class="split-screen">
        <div class="split-left">
            <div class="nav-logo mb-8" style="font-size: 1.5rem; justify-content: center;">◎ THE MISSION</div>
            <h1 class="hero-headline" style="font-size: 3rem; margin-bottom: 1rem;">Welcome<br>Back</h1>
            <p class="text-secondary" style="font-size: 1.2rem; max-width: 300px;">Global demand meets local action. Connect with the network.</p>
        </div>
        <div class="split-right">
            <div style="max-width: 400px; width: 100%; margin: 0 auto;">

                <div class="tabs">
                    <div class="tab active" id="tab-login" onclick="switchTab('login')">Login</div>
                    <div class="tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</div>
                </div>

                <!-- Login Form -->
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" class="form-control" required placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label for="login-pwd">Password</label>
                        <input type="password" id="login-pwd" class="form-control" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary w-full mt-4">Login</button>
                    <p id="login-error" aria-live="polite" class="text-secondary mt-2" style="color: var(--accent-coral); display: none;">Invalid credentials.</p>
                </form>

                <!-- Signup Form -->
                <form id="signup-form" onsubmit="handleSignup(event)" class="hidden">
                    <div class="form-group">
                        <label for="reg-name">Full Name</label>
                        <input type="text" id="reg-name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-pwd">Password</label>
                        <input type="password" id="reg-pwd" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-loc">Location (City, Country)</label>
                        <input type="text" id="reg-loc" class="form-control" required placeholder="e.g. Paris, France">
                    </div>
                    <div class="form-group">
                        <label for="reg-role">I want to...</label>
                        <select id="reg-role" class="form-control" required>
                            <option value="Requester">Post missions</option>
                            <option value="Provider">Help others</option>
                            <option value="Both">Both</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-full mt-4">Create Account</button>
                    <p id="signup-error" aria-live="polite" class="text-secondary mt-2" style="color: var(--accent-coral); display: none;">Email already exists.</p>
                </form>

                <div class="demo-accounts" id="demo-section">
                    <p class="text-secondary mb-4 caption">Try a demo account — click to log in instantly:</p>
                    <div id="demo-list"></div>
                </div>

            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Redirect if already logged in
        if (getSession()) {
            window.location.href = 'app.html';
        }

        function switchTab(tab) {
            if (tab === 'login') {
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('tab-signup').classList.remove('active');
                document.getElementById('login-form').classList.remove('hidden');
                document.getElementById('signup-form').classList.add('hidden');
                document.getElementById('demo-section').classList.remove('hidden');
            } else {
                document.getElementById('tab-signup').classList.add('active');
                document.getElementById('tab-login').classList.remove('active');
                document.getElementById('signup-form').classList.remove('hidden');
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('demo-section').classList.add('hidden');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pwd = document.getElementById('login-pwd').value;

            if (login(email, pwd)) {
                window.location.href = 'app.html';
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function handleSignup(e) {
            e.preventDefault();
            const data = {
                name: document.getElementById('reg-name').value,
                email: document.getElementById('reg-email').value,
                password: document.getElementById('reg-pwd').value,
                location: document.getElementById('reg-loc').value,
                role: document.getElementById('reg-role').value,
                bio: 'New user to The Mission.',
                flag: '🌍',
                missionsPosted: 0,
                tasksCompleted: 0
            };

            if (register(data)) {
                window.location.href = 'app.html';
            } else {
                document.getElementById('signup-error').style.display = 'block';
            }
        }

        // Populate Demo Accounts
        const demoList = document.getElementById('demo-list');
        DUMMY_ACCOUNTS.forEach(acc => {
            const el = document.createElement('div');
            el.className = 'demo-card';
            el.innerHTML = `
                <div class="avatar avatar-md">${acc.flag}</div>
                <div style="flex: 1;">
                    <div style="font-weight: 600;">${acc.name}</div>
                    <div class="caption">${acc.location}</div>
                </div>
                <span class="chip">${acc.role}</span>
            `;
            el.onclick = () => {
                document.getElementById('login-email').value = acc.email;
                document.getElementById('login-pwd').value = acc.password;
                document.getElementById('login-form').dispatchEvent(new Event('submit'));
            };
            demoList.appendChild(el);
        });
    </script>
</body>
</html>
