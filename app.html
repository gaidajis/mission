<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed | The Mission</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .filter-scroll { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; scrollbar-width: none; }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .filter-chip { cursor: pointer; border-color: var(--border); background: var(--bg-surface); transition: all 0.2s; }
        .filter-chip.active { background: var(--accent-teal); color: var(--bg-deep); border-color: var(--accent-teal); }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; gap: 1rem;}
        .search-input { flex: 1; max-width: 400px; background: var(--bg-surface); }

        /* Form Wizard */
        .wizard-step { display: none; }
        .wizard-step.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .cat-select-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; }
        .cat-select-card {
            border: 1px solid var(--border); border-radius: 8px; padding: 1rem; text-align: center;
            cursor: pointer; transition: all 0.2s; background: var(--bg-surface);
        }
        .cat-select-card:hover { border-color: var(--accent-teal); }
        .cat-select-card.selected { border-color: var(--accent-teal); background: var(--bg-elevated); box-shadow: 0 0 0 2px var(--accent-teal); }

        .progress-bar { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
        .progress-dot { height: 6px; flex: 1; background: var(--bg-surface); border-radius: 3px; transition: all 0.3s; }
        .progress-dot.active { background: var(--accent-teal); }
        .progress-dot.done { background: var(--border); }

        #view-post-mission, #view-my-missions, #view-my-tasks { display: none; }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="nav-logo mb-8 mt-2" style="font-size: 1.2rem;">◎ THE MISSION</div>

            <div class="flex-col gap-2 flex-1">
                <div class="nav-item active" onclick="switchView('feed', this)">
                    <span>🌍</span> Feed
                </div>
                <div class="nav-item" onclick="switchView('my-missions', this)">
                    <span>📋</span> My Missions
                </div>
                <div class="nav-item" onclick="switchView('my-tasks', this)">
                    <span>✅</span> My Tasks
                </div>
                <div class="nav-item" onclick="switchView('post-mission', this)">
                    <span>➕</span> Post Mission
                </div>
                <div class="nav-item" onclick="window.location.href='profile.html'">
                    <span>👤</span> Profile
                </div>
            </div>

            <div class="mt-auto pt-4 border-top" style="border-top: 1px solid var(--border);">
                <div class="flex items-center gap-3 mb-4">
                    <img id="user-avatar" class="avatar avatar-md" src="" alt="User">
                    <div>
                        <div id="user-name" style="font-weight: 600; font-size: 0.9rem;"></div>
                        <div class="caption cursor-pointer hover:text-white" onclick="logout()">Sign Out</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">

            <!-- FEED VIEW -->
            <div id="view-feed">
                <div class="top-bar">
                    <input type="text" id="search-bar" class="form-control search-input" placeholder="Search missions, locations..." onkeyup="handleSearch(event)">
                    <select id="sort-select" class="form-control" style="width: auto;" onchange="loadFeed()">
                        <option>Latest</option>
                        <option>Ending Soon</option>
                        <option>Highest Budget</option>
                        <option>Nearest</option>
                    </select>
                </div>

                <div class="filter-scroll mb-6" id="category-filters">
                    <div class="chip filter-chip active" onclick="setCategoryFilter(null, this)">All</div>
                    <!-- Populated by JS -->
                </div>

                <div class="masonry-grid" id="feed-grid">
                    <!-- Skeletons initially -->
                </div>
            </div>

            <!-- MY MISSIONS VIEW -->
            <div id="view-my-missions">
                <h2 class="section-heading mb-6">My Missions</h2>
                <div class="filter-scroll mb-6">
                    <div class="chip filter-chip active" onclick="loadMyMissions('open', this)">Posted (Open)</div>
                    <div class="chip filter-chip" onclick="loadMyMissions('in_progress', this)">In Progress</div>
                    <div class="chip filter-chip" onclick="loadMyMissions('completed', this)">Completed</div>
                </div>
                <div class="masonry-grid" id="my-missions-grid"></div>
            </div>

            <!-- MY TASKS VIEW -->
            <div id="view-my-tasks">
                <h2 class="section-heading mb-6">My Tasks</h2>
                <div class="filter-scroll mb-6">
                    <div class="chip filter-chip active" onclick="loadMyTasks('in_progress', this)">Accepted</div>
                    <div class="chip filter-chip" onclick="loadMyTasks('completed', this)">Done</div>
                </div>
                <div class="masonry-grid" id="my-tasks-grid"></div>
            </div>

            <!-- POST MISSION VIEW -->
            <div id="view-post-mission" style="max-width: 600px; margin: 0 auto;">
                <h2 class="section-heading mb-6 text-center">Post a Mission</h2>

                <div class="progress-bar">
                    <div class="progress-dot active" id="dot-1"></div>
                    <div class="progress-dot" id="dot-2"></div>
                    <div class="progress-dot" id="dot-3"></div>
                </div>

                <form id="post-form" onsubmit="submitMission(event)">

                    <!-- Step 1 -->
                    <div class="wizard-step active" id="step-1">
                        <div class="form-group">
                            <label for="post-title">Mission Title</label>
                            <input type="text" id="post-title" class="form-control" required placeholder="e.g. Source a Patek Philippe dealer open on Sunday...">
                        </div>
                        <div class="form-group">
                            <label for="post-desc">Description</label>
                            <textarea id="post-desc" class="form-control" rows="4" required placeholder="Provide all necessary details..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="post-cat">Category</label>
                            <div class="cat-select-grid" id="post-cat-grid">
                                <!-- Populated by JS -->
                            </div>
                            <input type="hidden" id="post-cat" required>
                        </div>
                        <div class="flex justify-between mt-8">
                            <div></div>
                            <button type="button" class="btn btn-primary" onclick="nextStep(2)">Next: Details →</button>
                        </div>
                    </div>

                    <!-- Step 2 -->
                    <div class="wizard-step" id="step-2">
                        <div class="form-group">
                            <label for="post-loc">Location</label>
                            <input type="text" id="post-loc" class="form-control" required placeholder="City, Country (or 'Online')">
                            <div class="mt-2 flex gap-2">
                                <label for="post-online" style="display: flex; align-items: center; gap: 0.5rem; font-weight: 400; color: var(--text-primary);">
                                    <input type="checkbox" id="post-online"> This is a purely online/virtual task
                                </label>
                            </div>
                        </div>
                        <div class="flex gap-4">
                            <div class="form-group w-full">
                                <label for="post-budget">Budget Amount</label>
                                <input type="number" id="post-budget" class="form-control" required min="5">
                            </div>
                            <div class="form-group" style="width: 120px;">
                                <label for="post-currency">Currency</label>
                                <select id="post-currency" class="form-control">
                                    <option>USD</option><option>EUR</option><option>GBP</option>
                                    <option>CHF</option><option>JPY</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="post-deadline">Deadline</label>
                            <input type="date" id="post-deadline" class="form-control" required>
                        </div>
                        <div class="flex justify-between mt-8">
                            <button type="button" class="btn btn-secondary" onclick="nextStep(1)">← Back</button>
                            <button type="button" class="btn btn-primary" onclick="previewMission()">Next: Review →</button>
                        </div>
                    </div>

                    <!-- Step 3 -->
                    <div class="wizard-step" id="step-3">
                        <p class="text-secondary mb-4 text-center">Here's how your mission will look in the feed:</p>

                        <div id="preview-card" class="card mb-8"></div>

                        <div class="flex justify-between mt-8">
                            <button type="button" class="btn btn-secondary" onclick="nextStep(2)">← Edit</button>
                            <button type="submit" class="btn btn-primary" style="background-color: var(--cat-goods); color: var(--bg-deep);">Post Mission</button>
                        </div>
                    </div>

                </form>
            </div>

        </div>
    </div>

    <!-- Mobile Nav -->
    <div class="mobile-nav">
        <div class="mobile-nav-item active" onclick="switchView('feed', this)">
            <span style="font-size: 1.5rem;">🌍</span> Feed
        </div>
        <div class="mobile-nav-item" onclick="switchView('my-missions', this)">
            <span style="font-size: 1.5rem;">📋</span> My Missions
        </div>
        <div class="mobile-nav-item" onclick="switchView('post-mission', this)">
            <span style="font-size: 1.5rem;">➕</span> Post
        </div>
        <div class="mobile-nav-item" onclick="window.location.href='profile.html'">
            <span style="font-size: 1.5rem;">👤</span> Profile
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        requireAuth();
        const currentUser = getSession();

        let currentFilter = { category: null, status: 'open', search: '', sortBy: 'Latest' };

        document.addEventListener('DOMContentLoaded', () => {
            // Setup User Info
            document.getElementById('user-name').innerText = currentUser.name;
            document.getElementById('user-avatar').src = getInitialsAvatar(currentUser.name);

            // Setup Category Filters
            const filterContainer = document.getElementById('category-filters');
            Object.keys(CATEGORIES).forEach(cat => {
                const el = document.createElement('div');
                el.className = 'chip filter-chip';
                el.innerHTML = `${CATEGORIES[cat].icon} ${cat}`;
                el.onclick = function() { setCategoryFilter(cat, this); };
                filterContainer.appendChild(el);
            });

            // Setup Post Categories
            const catGrid = document.getElementById('post-cat-grid');
            Object.keys(CATEGORIES).forEach(cat => {
                const el = document.createElement('div');
                el.className = 'cat-select-card';
                el.innerHTML = `<div style="font-size: 1.5rem; margin-bottom: 0.5rem;">${CATEGORIES[cat].icon}</div><div>${cat}</div>`;
                el.onclick = function() {
                    document.querySelectorAll('.cat-select-card').forEach(c => c.classList.remove('selected'));
                    this.classList.add('selected');
                    document.getElementById('post-cat').value = cat;
                };
                catGrid.appendChild(el);
            });

            // Set min date for deadline
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('post-deadline').setAttribute('min', today);

            // Initial Load
            loadFeedWithDelay();

            // Check hash for direct routing
            if(window.location.hash === '#post') {
                switchView('post-mission', document.querySelectorAll('.nav-item')[3]);
            }
        });

        // --- NAVIGATION ---
        function switchView(viewId, navEl) {
            document.getElementById('view-feed').style.display = 'none';
            document.getElementById('view-my-missions').style.display = 'none';
            document.getElementById('view-my-tasks').style.display = 'none';
            document.getElementById('view-post-mission').style.display = 'none';

            document.getElementById('view-' + viewId).style.display = 'block';

            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.mobile-nav-item').forEach(el => el.classList.remove('active'));
            if(navEl) navEl.classList.add('active');

            if (viewId === 'feed') loadFeedWithDelay();
            if (viewId === 'my-missions') loadMyMissions('open', document.querySelector('#view-my-missions .filter-chip.active'));
            if (viewId === 'my-tasks') loadMyTasks('in_progress', document.querySelector('#view-my-tasks .filter-chip.active'));
        }

        // --- FEED LOGIC ---
        function setCategoryFilter(cat, el) {
            document.querySelectorAll('#category-filters .filter-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            currentFilter.category = cat;
            loadFeed();
        }

        function handleSearch(e) {
            currentFilter.search = e.target.value;
            loadFeed();
        }

        function loadFeedWithDelay() {
            const grid = document.getElementById('feed-grid');
            grid.innerHTML = '';
            for(let i=0; i<6; i++) {
                grid.innerHTML += `<div class="skeleton" style="height: 250px;"></div>`;
            }
            setTimeout(loadFeed, 300);
        }

        function loadFeed() {
            currentFilter.sortBy = document.getElementById('sort-select').value;
            const reqs = getRequests(currentFilter);
            renderGrid('feed-grid', reqs);
        }

        function loadMyMissions(status, el) {
            if(el) {
                document.querySelectorAll('#view-my-missions .filter-chip').forEach(c => c.classList.remove('active'));
                el.classList.add('active');
            }
            const reqs = getRequests({ requesterId: currentUser.id, status: status, sortBy: 'Latest' });
            renderGrid('my-missions-grid', reqs);
        }

        function loadMyTasks(status, el) {
            if(el) {
                document.querySelectorAll('#view-my-tasks .filter-chip').forEach(c => c.classList.remove('active'));
                el.classList.add('active');
            }
            const reqs = getRequests({ providerId: currentUser.id, status: status, sortBy: 'Latest' });
            renderGrid('my-tasks-grid', reqs);
        }

        function renderGrid(gridId, reqs) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '';

            if (reqs.length === 0) {
                grid.style.display = 'block';
                grid.innerHTML = `
                    <div class="text-center py-12" style="grid-column: 1 / -1;">
                        <div style="font-size: 4rem; margin-bottom: 1rem;">🌍</div>
                        <h3 class="mb-2">No missions found</h3>
                        <p class="text-secondary">Try adjusting your filters or be the first to post one!</p>
                    </div>
                `;
                return;
            }

            grid.style.display = 'grid';

            reqs.forEach(req => {
                const cat = CATEGORIES[req.category];
                const requester = getUserById(req.requesterId);
                const deadlineText = formatDeadline(req.deadline);
                const deadlineColor = deadlineText.includes("Overdue") || deadlineText === "Today" ? "var(--accent-coral)" :
                                     (deadlineText === "1 day left" ? "var(--accent-gold)" : "var(--bg-elevated)");

                const card = document.createElement('div');
                card.className = `card hoverable cat-border ${cat.className}`;
                card.style.cursor = 'pointer';
                card.onclick = () => window.location.href = `request.html?id=${req.id}`;

                let statusBadge = '';
                if(req.status === 'in_progress') statusBadge = `<span class="badge" style="background-color: var(--accent-teal); color: var(--bg-deep);">In Progress</span>`;
                if(req.status === 'completed') statusBadge = `<span class="badge" style="background-color: var(--border); color: var(--text-primary);">Completed</span>`;

                card.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <span class="chip" style="color: ${cat.color}; border-color: ${cat.color}40">
                            ${cat.icon} ${req.category}
                        </span>
                        <div class="flex gap-2">
                            ${statusBadge}
                            <span class="badge" style="background-color: ${deadlineColor}; color: ${deadlineColor === 'var(--bg-elevated)' ? 'var(--text-primary)' : 'var(--bg-deep)'}; border: 1px solid var(--border);">
                                ⏰ ${deadlineText}
                            </span>
                        </div>
                    </div>
                    <h3 class="mb-2" style="font-weight: 600; line-height: 1.3;">${req.title}</h3>
                    <div class="flex items-center gap-2 mb-3 text-secondary caption">
                        <span>📍 ${req.location}</span>
                        ${req.online ? '<span class="badge" style="background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-primary)">Online</span>' : ''}
                    </div>
                    <p class="text-secondary mb-4" style="font-size: 0.9rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                        ${req.description}
                    </p>
                    <div class="flex justify-between items-center border-top pt-3" style="border-top: 1px solid var(--border);">
                        <div class="flex items-center gap-2">
                            <div class="avatar avatar-sm">${requester.flag}</div>
                            <span class="caption">${requester.name.split(' ')[0]}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span style="font-weight: 700; color: var(--accent-teal);">
                                ${formatBudget(req.budget, req.currency)}
                            </span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- POST WIZARD LOGIC ---
        function nextStep(step) {
            // Validate before moving
            if (step === 2) {
                if(!document.getElementById('post-title').value || !document.getElementById('post-desc').value || !document.getElementById('post-cat').value) {
                    showToast("Please fill all required fields in Step 1");
                    return;
                }
            }

            document.querySelectorAll('.wizard-step').forEach(el => el.classList.remove('active'));
            document.getElementById('step-' + step).classList.add('active');

            document.querySelectorAll('.progress-dot').forEach((el, idx) => {
                if (idx + 1 === step) { el.classList.add('active'); el.classList.remove('done'); }
                else if (idx + 1 < step) { el.classList.remove('active'); el.classList.add('done'); }
                else { el.classList.remove('active', 'done'); }
            });
        }

        function previewMission() {
            if(!document.getElementById('post-loc').value || !document.getElementById('post-budget').value || !document.getElementById('post-deadline').value) {
                showToast("Please fill all required fields in Step 2");
                return;
            }

            const title = document.getElementById('post-title').value;
            const desc = document.getElementById('post-desc').value;
            const catName = document.getElementById('post-cat').value;
            const cat = CATEGORIES[catName];
            const loc = document.getElementById('post-loc').value;
            const budget = document.getElementById('post-budget').value;
            const cur = document.getElementById('post-currency').value;
            const online = document.getElementById('post-online').checked;

            document.getElementById('preview-card').className = `card cat-border ${cat.className}`;
            document.getElementById('preview-card').innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <span class="chip" style="color: ${cat.color}; border-color: ${cat.color}40">
                        ${cat.icon} ${catName}
                    </span>
                </div>
                <h3 class="mb-2" style="font-weight: 600;">${title}</h3>
                <div class="flex items-center gap-2 mb-3 text-secondary caption">
                    <span>📍 ${loc}</span>
                    ${online ? '<span class="badge" style="background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-primary)">Online</span>' : ''}
                </div>
                <p class="text-secondary mb-4" style="font-size: 0.9rem;">${desc}</p>
                <div class="flex justify-between items-center border-top pt-3" style="border-top: 1px solid var(--border);">
                    <div class="flex items-center gap-2">
                        <div class="avatar avatar-sm">${currentUser.flag}</div>
                        <span class="caption">${currentUser.name.split(' ')[0]}</span>
                    </div>
                    <span style="font-weight: 700; color: var(--accent-teal);">${formatBudget(budget, cur)}</span>
                </div>
            `;
            nextStep(3);
        }

        function submitMission(e) {
            e.preventDefault();
            const newReq = {
                id: generateId(),
                title: document.getElementById('post-title').value,
                category: document.getElementById('post-cat').value,
                budget: parseFloat(document.getElementById('post-budget').value),
                currency: document.getElementById('post-currency').value,
                requesterId: currentUser.id,
                providerId: null,
                status: 'open',
                location: document.getElementById('post-loc').value,
                deadline: document.getElementById('post-deadline').value + "T23:59:59Z",
                online: document.getElementById('post-online').checked,
                description: document.getElementById('post-desc').value,
                postedDate: new Date().toISOString(),
                messages: []
            };

            saveRequest(newReq);

            // Update user stats
            currentUser.missionsPosted = (currentUser.missionsPosted || 0) + 1;
            saveUser(currentUser);

            showToast("Mission posted successfully!");
            setTimeout(() => {
                window.location.href = `request.html?id=${newReq.id}`;
            }, 1000);
        }
    </script>
</body>
</html>
